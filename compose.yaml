name: collabpad

services:
  app:
    build: .
    image: collabpad:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COLLABPAD_PORT:-8000}:8000"
    environment:
      # SQLite and baked sprites both live in the data volume.
      DATA_DIR: /var/lib/collabpad
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8000}"
      SMTP_HOST: "${SMTP_HOST:-}"
      SMTP_PORT: "${SMTP_PORT:-465}"
      SMTP_FROM: "${SMTP_FROM:-}"
      SMTP_USER: "${SMTP_USER:-}"
      SMTP_PASSWORD: "${SMTP_PASSWORD:-}"
      ADS_BLOCK_SIDE: "${ADS_BLOCK_SIDE:-}"
      ADS_BLOCK_BOTTOM: "${ADS_BLOCK_BOTTOM:-}"
      VLM_API_KEY: "${VLM_API_KEY:-}"
      # Set to http://vlm-egress:1055 to send only the VLM calls through Tailscale.
      VLM_PROXY_URL: "${VLM_PROXY_URL:-}"
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      FORWARDED_ALLOW_IPS: "${COLLABPAD_FORWARDED_ALLOW_IPS:-127.0.0.1}"
      MAX_POINTS_PER_STROKE: "${MAX_POINTS_PER_STROKE:-2000}"
      MAX_PAYLOAD_BYTES: "${MAX_PAYLOAD_BYTES:-65536}"
      BRUSH_WIDTH_MIN: "${BRUSH_WIDTH_MIN:-1}"
      BRUSH_WIDTH_MAX: "${BRUSH_WIDTH_MAX:-40}"
      SIMPLIFY_EPSILON: "${SIMPLIFY_EPSILON:-0.5}"
      PALETTE: "${PALETTE:-#000000,#FFFFFF,#E53935,#FB8C00,#FDD835,#43A047,#1E88E5,#8E24AA}"
    volumes:
      - data:/var/lib/collabpad
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      replicas: 1
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

  # Optional (docker compose --profile egress up): Tailscale in userspace mode as an HTTP
  # proxy that leaves through an exit node. Only the VLM client uses it; everything else
  # (ЮKassa, mail, visitors) stays on the host network. No TUN device, no NET_ADMIN.
  vlm-egress:
    profiles: [egress]
    image: tailscale/tailscale:v1.104.7
    hostname: collabpad-vlm-egress
    restart: unless-stopped
    environment:
      TS_AUTHKEY: "${TS_AUTHKEY:-}"
      TS_HOSTNAME: collabpad-vlm-egress
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_OUTBOUND_HTTP_PROXY_LISTEN: "0.0.0.0:1055"
      TS_EXTRA_ARGS: "--exit-node=${TS_EXIT_NODE:-}"
    volumes:
      - egress:/var/lib/tailscale
    # No published ports: the proxy is reachable only from this Compose network.
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  data:
  egress:
