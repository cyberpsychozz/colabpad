name: collabpad

services:
  app:
    build: .
    image: collabpad:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:${COLLABPAD_PORT:-8000}:8000"
    environment:
      # SQLite and baked sprites both live in the data volume.
      DATA_DIR: /var/lib/collabpad
      PUBLIC_URL: "${PUBLIC_URL:-http://localhost:8000}"
      VLM_API_KEY: "${VLM_API_KEY:-}"
      YOOKASSA_SHOP_ID: "${YOOKASSA_SHOP_ID:-}"
      YOOKASSA_SECRET_KEY: "${YOOKASSA_SECRET_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000,http://127.0.0.1:8000}"
      FORWARDED_ALLOW_IPS: "${COLLABPAD_FORWARDED_ALLOW_IPS:-127.0.0.1}"
      MAX_POINTS_PER_STROKE: "${MAX_POINTS_PER_STROKE:-2000}"
      MAX_PAYLOAD_BYTES: "${MAX_PAYLOAD_BYTES:-65536}"
      BRUSH_WIDTH_MIN: "${BRUSH_WIDTH_MIN:-1}"
      BRUSH_WIDTH_MAX: "${BRUSH_WIDTH_MAX:-40}"
      SIMPLIFY_EPSILON: "${SIMPLIFY_EPSILON:-0.5}"
      PALETTE: "${PALETTE:-#000000,#FFFFFF,#E53935,#FB8C00,#FDD835,#43A047,#1E88E5,#8E24AA}"
    volumes:
      - data:/var/lib/collabpad
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    deploy:
      replicas: 1
    logging:
      driver: local
      options:
        max-size: "5m"
        max-file: "2"

volumes:
  data:
