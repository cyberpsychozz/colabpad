# Subscriptions and payments (docs/spec.md §9).
# Robokassa, test mode only. Prices are always in rubles (kopecks here).
currency: RUB
plans:
  plus_month: {amount_kop: 29900, period_days: 30}
  plus_year: {amount_kop: 249000, period_days: 365}
past_due_grace_days: 3
renewal_hour_msk: 3
# The fiscal receipt (54-FZ) sent with each payment as Robokassa's Receipt parameter.
# sno: the shop's tax system (osn, usn_income, usn_income_outcome, esn, patent); empty means
# the default from the Robokassa cabinet. tax: none, vat0, vat5, vat7, vat10, vat20, vat22, ...
# A self-employed shop keeps it on with «Робочеки СМЗ» (the НПД receipt takes the items from it)
# and leaves sno empty. Turn it off only if the shop has no fiscalization at all.
receipt:
  enabled: true
  sno:
  tax: none
  payment_method: full_payment
  payment_object: service
# ResultURL is accepted only from Robokassa's notification addresses.
result_ips:
  - 185.59.216.65
  - 185.59.217.65
