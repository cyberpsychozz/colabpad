# VLM adapter settings. The key comes from env (VLM_API_KEY), never from this file.
# Model IDs checked against the OpenRouter model list on 2026-11-16.
base_url: https://openrouter.ai/api/v1
primary_model: google/gemini-3.8-flash
fallback_model: qwen/qwen3-vl-235b-a22b-instruct
# Motion receives only text and fixed drawing geometry. It can use a separate LLM.
motion_model: google/gemini-3.8-flash
motion_fallback_model: qwen/qwen3-vl-235b-a22b-instruct
temperature: 0
max_tokens: 700
# Text-directed choreography needs more output than drawing classification (spec §4a).
generation_max_tokens: 8192
generation:
  # Two sequential provider operations share this deadline; ordinary ALIVE stays at 25s.
  hard_timeout_s: 90
  request_timeout_s: 30
  description_chars: 1000
  duration_ms: 30000
  parts: 16
  keyframes: 256
  repetitions: 8
  plan_bytes: 65536
  root_displacement_px: 512
  loop_pause_ms: 2000
timeout_s: 10
retries: 1               # extra attempts on the primary model before the fallback
daily_budget_usd: 5      # shared by classification, parts and motion
# Used when the provider does not report the cost of a call.
estimated_call_usd: 0.004
